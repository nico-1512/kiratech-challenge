apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-class
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
spec:
  project: default
  source:
    repoURL: https://github.com/nico-1512/kiratech-challenge.git
    targetRevision: main
    path: gitops/platform/envoy-gateway-class/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
