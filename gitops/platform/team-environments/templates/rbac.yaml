apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-developer
  namespace: team-{{ .Values.teamName }}
rules:
  - apiGroups: ["", apps, batch, networking.k8s.io]
    resources: [pods, pods/log, pods/exec, services, configmaps, secrets, events, deployments, replicasets, statefulsets, jobs, cronjobs, ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-developer
  namespace: team-{{ .Values.teamName }}
subjects:
  - kind: Group
    name: team:{{ .Values.teamName }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: team-developer
  apiGroup: rbac.authorization.k8s.io
