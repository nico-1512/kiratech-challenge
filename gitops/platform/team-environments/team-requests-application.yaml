apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-team-requests
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: team-environments
spec:
  project: default
  source:
    repoURL: https://github.com/nico-1512/kiratech-challenge.git
    targetRevision: main
    path: gitops/team-requests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
