apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-blue
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: team-environments
spec:
  project: default
  source:
    repoURL: https://github.com/nico-1512/kiratech-challenge.git
    targetRevision: main
    path: gitops/platform/team-environments
    helm:
      valuesObject:
        teamName: blue
        size: S
        teamRepository: https://github.com/nico-1512/kiratech-challenge.git
        teamPath: gitops/team-workloads/blue
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
