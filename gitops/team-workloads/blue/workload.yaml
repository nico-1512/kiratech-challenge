apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: team-blue
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: team-blue
spec:
  selector:
    app: db
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: team-blue
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - while true; do curl --fail --silent http://db.team-blue.svc.cluster.local/ >/dev/null && echo "database reachable"; sleep 10; done
          readinessProbe:
            exec:
              command: [sh, -c, "curl --fail --silent http://db.team-blue.svc.cluster.local/ >/dev/null"]
            periodSeconds: 5
